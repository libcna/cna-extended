name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  linked:
    name: Linked build and tests (software/headless)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out cna-extended
        uses: actions/checkout@v4
        with:
          path: cna-extended
          submodules: true

      # Keep these refs in sync with NEXT.md. Verify candidates locally first.
      - name: Check out cna
        uses: actions/checkout@v4
        with:
          repository: libcna/cna
          ref: 8dc7a7b9945693b7f83a89e8f5e868caac5f9125
          path: cna

      - name: Check out sharp-runtime
        uses: actions/checkout@v4
        with:
          repository: libcna/sharp-runtime
          ref: 88f6b11fbb8b9d1db1b9451e86f8835e1c9cafaa
          path: sharp-runtime

      - name: Configure
        working-directory: cna-extended
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCNA_ENABLE_SDL=OFF -DCNA_ENABLE_VIDEO=OFF

      - name: Build
        working-directory: cna-extended
        run: cmake --build build --parallel 2

      - name: Test
        working-directory: cna-extended
        run: ctest --test-dir build -j2 --output-on-failure
