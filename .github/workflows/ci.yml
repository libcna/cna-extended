name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  linked:
    name: Linked build and tests (software/headless)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out cna-extended
        uses: actions/checkout@v4
        with:
          path: cna-extended
          submodules: true

      # Keep these refs in sync with NEXT.md. Verify candidates locally first.
      - name: Check out cna
        uses: actions/checkout@v4
        with:
          repository: libcna/cna
          ref: 4ef67873b252bb07bcb270011ae7bc5a55aac105
          path: cna

      - name: Check out sharp-runtime
        uses: actions/checkout@v4
        with:
          repository: libcna/sharp-runtime
          ref: f8ea4b1f781fffab887d55966949395ae6e1b5ab
          path: sharp-runtime

      - name: Configure
        working-directory: cna-extended
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCNA_ENABLE_SDL=OFF -DCNA_ENABLE_VIDEO=OFF

      - name: Build
        working-directory: cna-extended
        run: cmake --build build --parallel 2

      - name: Test
        working-directory: cna-extended
        run: ctest --test-dir build -j2 --output-on-failure
